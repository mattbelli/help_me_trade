[package]
name = "hmt-desktop"
version = "0.1.0"
edition = "2021"
description = "help_me_trade desktop shell — a Tauri window on the serv cockpit + a global kill-switch hotkey"
publish = false

[[bin]]
name = "hmt-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
