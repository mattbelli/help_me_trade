use_default_settings: true

server:
  secret_key: "__SEARXNG_SECRET__"

# The JSON format is DISABLED by default upstream. ai/research/sources.py calls
# /search?format=json, so without this the copilot's only web arm 404s.
search:
  formats:
    - html
    - json

# The default general engines (duckduckgo/startpage/brave) get CAPTCHA'd or
# rate-limited from this host's IP often enough to zero out web results. Keeping
# bing in the general pool leaves a resilient fallback so a blocked engine set
# does not leave the agent web-blind. Adapted from the odysseus project's
# SearXNG config, which hit and solved the same problem on this box.
#
# Resilience here comes from ENGINE DIVERSITY, not from looking less like a bot:
# SearXNG already rotates a Firefox user-agent pool and brave still answers
# "Too many request", because the big engines throttle by requests-per-IP.
# mojeek runs its own independent index (not a Bing/Google reseller) and does
# not throttle this host, so it holds the floor up when the majors block —
# `disabled: true` upstream, enabled here on purpose.
engines:
  - name: bing
    engine: bing
    disabled: false
    categories:
      - general
      - web

  - name: mojeek
    engine: mojeek
    shortcut: mjk
    disabled: false
    categories:
      - general
      - web
