<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Terminal — Persist / Panes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #1c2333;
    --border: #30363d;
    --fg: #e6edf3;
    --fg2: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --blue: #58a6ff;
    --orange: #d4762b;
    --cyan: #39d2c0;
    --radius: 6px;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'Inter', -apple-system, sans-serif;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top status bar ── */
  .status-bar {
    display: flex;
    align-items: center;
    padding: 6px 16px;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .status-bar .logo {
    font-weight: 700; font-size: 12px; color: var(--cyan);
  }
  .status-bar .conn {
    display: flex; align-items: center; gap: 5px; color: var(--fg2);
  }
  .status-bar .conn .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
  .status-bar .mode {
    padding: 1px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
    color: var(--cyan); font-weight: 500;
  }
  .status-bar .mode:hover { background: var(--bg3); cursor: default; }
  .status-bar .summary {
    margin-left: auto; display: flex; gap: 20px; color: var(--fg2);
  }
  .status-bar .summary span .num { color: var(--fg); font-weight: 500; }
  .status-bar .summary span .num.green { color: var(--green); }
  .status-bar .summary span .num.red { color: var(--red); }
  .status-bar .clock { color: var(--fg2); }

  /* ── Main layout: sidebar + content ── */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── Left sidebar ── */
  .sidebar {
    width: 180px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar .header {
    padding: 12px 14px 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--fg2);
    font-family: var(--font-mono);
  }
  .sidebar .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg2);
    border-left: 2px solid transparent;
    transition: all .1s;
  }
  .sidebar .nav-item:hover { background: var(--bg3); color: var(--fg); }
  .sidebar .nav-item.active {
    color: var(--fg);
    background: var(--bg3);
    border-left-color: var(--cyan);
  }
  .sidebar .nav-item .icon { width: 16px; text-align: center; }
  .sidebar .nav-item .shortcut {
    margin-left: auto;
    font-size: 10px;
    color: var(--fg2);
    opacity: .6;
  }
  .sidebar .spacer { flex: 1; }
  .sidebar .bottom-item {
    padding: 8px 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg2);
    cursor: pointer;
    border-top: 1px solid var(--border);
    transition: color .1s;
  }
  .sidebar .bottom-item:hover { color: var(--fg); }

  /* ── Right content area ── */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Content toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar .view-title {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
    color: var(--fg);
  }
  .toolbar .slash-btn {
    margin-left: auto;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg2);
    color: var(--fg2);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    transition: all .1s;
  }
  .toolbar .slash-btn:hover { background: var(--bg3); color: var(--fg); border-color: var(--cyan); }
  .toolbar .filter-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 11px;
    width: 180px;
  }
  .toolbar .filter-input::placeholder { color: var(--fg2); }
  .toolbar .filter-input:focus { outline: none; border-color: var(--blue); }

  /* ── Main view body ── */
  .view-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  /* ── Bottom command bar ── */
  .cmd-bar {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    background: var(--bg3);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .cmd-bar .prompt {
    color: var(--cyan);
    font-weight: 600;
  }
  .cmd-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .cmd-bar input::placeholder { color: var(--fg2); }
  .cmd-bar .hints {
    display: flex;
    gap: 12px;
    color: var(--fg2);
    font-size: 11px;
  }
  .cmd-bar .hints kbd {
    color: var(--fg);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }

  /* ── Table styles ── */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .data-table th {
    text-align: left;
    color: var(--fg2);
    font-weight: 500;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .data-table td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }
  .data-table tr:hover td { background: var(--bg3); }
  .data-table .green { color: var(--green); }
  .data-table .red { color: var(--red); }
  .data-table .yellow { color: var(--yellow); }
  .data-table .cyan { color: var(--cyan); }

  /* ── Stats row ── */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .stat-box {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .stat-box .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--fg2);
    font-family: var(--font-mono);
  }
  .stat-box .value {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 600;
    margin-top: 4px;
  }

  /* ── Trade form ── */
  .trade-form { 
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .trade-form .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .trade-form .field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--fg2);
    font-family: var(--font-mono);
  }
  .trade-form .field input,
  .trade-form .field select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .trade-form .field input:focus,
  .trade-form .field select:focus {
    outline: none;
    border-color: var(--blue);
  }
  .trade-form .actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .trade-form .actions button {
    flex: 1;
    padding: 7px;
    border: none;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .trade-form .actions button:hover { opacity: .85; }
  .btn-buy { background: var(--green); color: #0d1117; }
  .btn-sell { background: var(--red); color: #fff; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 18px;
    font-family: var(--font-mono);
    font-size: 11px;
    opacity: 0;
    transition: all .25s ease;
    z-index: 20;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- Status bar -->
<div class="status-bar">

  <div class="conn"><span class="dot"></span>Alpaca</div>

  <div class="summary">

<!-- Main -->

    <div class="nav-item" data-view="history"><span class="icon">◷</span>History<span class="shortcut">⌘5</span></div>
    <div class="spacer"></div>
    <div class="nav-item" data-view="settings"><span class="icon">⚙</span>Settings</div>
    <div class="bottom-item">/ for commands</div>
  </div>

  <!-- Content area -->
  <div class="content">
    <div class="toolbar" id="toolbar">
      <span class="view-title" id="viewTitle">Dashboard</span>
      <input class="filter-input" id="filterInput" placeholder="Filter..." style="display:none;">

</div>

<!-- Bottom command bar -->
<div class="cmd-bar" id="cmdBar" style="display:none;">

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

            <tr><td style="color:var(--fg2);">#38471</td><td class="cyan">TSLA</td><td class="red">SELL</td><td>Limit</td><td>50</td><td>$345.00</td><td class="green">filled</td><td>09:15:03</td></tr>
            <tr><td style="color:var(--fg2);">#38470</td><td class="cyan">AMD</td><td class="green">BUY</td><td>Market</td><td>100</td><td>$128.35</td><td class="green">filled</td><td>09:12:48</td></tr>
            <tr><td style="color:var(--fg2);">#38468</td><td class="cyan">QQQ</td><td class="green">BUY</td><td>Market</td><td>25</td><td>$482.15</td><td class="green">filled</td><td>08:30:12</td></tr>
            <tr><td style="color:var(--fg2);">#38462</td><td class="cyan">AAPL</td><td class="green">BUY</td><td>Limit</td><td>90</td><td>$198.30</td><td class="green">filled</td><td>Jun 14</td></tr>
            <tr><td style="color:var(--fg2);">#38455</td><td class="cyan">NVDA</td><td class="green">BUY</td><td>Market</td><td>100</td><td>$842.00</td><td class="green">filled</td><td>Jun 12</td></tr>
          </tbody>
        </table>`;
    },
  };

  let currentView = 'dashboard';

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = '✓ ' + msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function renderView(name) {
    currentView = name;
    const titles = {
      dashboard: 'Dashboard', positions: 'Positions', orders: 'Orders',
      watchlist: 'Watchlist', trade: 'Trade', history: 'History', settings: 'Settings'
    };
    document.getElementById('viewTitle').textContent = titles[name] || name;
    document.getElementById('viewBody').innerHTML = views[name] ? views[name]() : '<div style="color:var(--fg2);font-family:var(--font-mono);font-size:13px;padding:20px;">Coming soon...</div>';

    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const active = document.querySelector(`.nav-item[data-view="${name}"]`);
    if (active) active.classList.add('active');

    const mode = document.querySelector('.mode');
    if (mode) mode.textContent = name;
  }

  // ── Nav clicks ──
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const view = item.dataset.view;
      if (view === 'settings') {
        showToast('Settings — configure Alpaca keys, risk limits');
        return;
      }
      renderView(view);
    });
  });

  // ── Slash command bar ──
  let cmdOpen = false;
  document.getElementById('slashBtn').addEventListener('click', () => toggleCmd());
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && document.activeElement?.tagName !== 'INPUT') {
      e.preventDefault();
      toggleCmd();
    }
    if (e.key === 'Escape' && cmdOpen) { toggleCmd(); }
    if (e.key === 'Enter' && cmdOpen) {
      const val = document.getElementById('cmdInput').value;
      const valid = ['dashboard','positions','orders','watchlist','trade','history','settings'];
      if (valid.includes(val)) renderView(val);
      else showToast('Unknown command: ' + val);
      toggleCmd();
      document.getElementById('cmdInput').value = '';
    }
  });

  function toggleCmd() {
    const bar = document.getElementById('cmdBar');
    cmdOpen = !cmdOpen;
    bar.style.display = cmdOpen ? '' : 'none';
    if (cmdOpen) document.getElementById('cmdInput').focus();
    else document.getElementById('cmdInput').blur();
  }

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', e => {
    if (e.metaKey && e.key === '1') { e.preventDefault(); renderView('dashboard'); }
    if (e.metaKey && e.key === '2') { e.preventDefault(); renderView('positions'); }
    if (e.metaKey && e.key === '3') { e.preventDefault(); renderView('orders'); }
    if (e.metaKey && e.key === '4') { e.preventDefault(); renderView('watchlist'); }
    if (e.metaKey && e.key === '5') { e.preventDefault(); renderView('history'); }
    if (e.metaKey && (e.key === 't' || e.key === 'T')) { e.preventDefault(); renderView('trade'); }
  });

  // ── Init ──
  renderView('dashboard');

  // ── Clock ──
  function updateClock() {
    const d = new Date();
    const et = d.toLocaleString('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false });
    document.getElementById('clock').textContent = et + ' ET';
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
