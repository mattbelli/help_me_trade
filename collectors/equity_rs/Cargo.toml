[package]
name = "equity_rs"
version = "0.1.0"
edition = "2021"
description = "help_me_trade equity tape collector (Rust) — Alpaca stocks-v2 wildcard tape"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# wss:// live: pick the TLS crypto provider explicitly (rustls 0.23 panics at
# connect time when none is installed — the replay harness is plain ws://).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
rmpv = "1"
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
