[package]
name = "flow_rs"
version = "0.1.0"
edition = "2021"
description = "help_me_trade OPRA options-flow collector (Rust) — Databento tcbbo spine + detectors"

[dependencies]
dbn = { version = "0.66", default-features = true }
databento = { version = "0.58", default-features = false, features = ["live"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
time = "0.3"
zstd = "0.13"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
chrono-tz = "0.10"
serde_json = "1"
# the Alpaca wildcard-trades sidecar (condition codes + GTH tape): msgpack over wss
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
rmpv = "1"

[profile.release]
lto = "thin"
codegen-units = 1
