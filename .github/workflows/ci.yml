name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same ref, so a busy merge day
# doesn't run every superseded push/PR-sync to completion (saves Actions minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run on the serv self-hosted runner (free minutes; the runner's systemd
# unit caps it at 4 cores / 6G so CI can't starve the live app). One runner =
# jobs serialize; acceptable at ~1 min for the typecheck job.
jobs:
  lint-and-test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q

  frontend-typecheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Deterministic install from the committed lockfile (verified in-sync with package.json).
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck
