# Frontend typecheck (~1 min). Runs only when frontend files (or this
# workflow) change; python-only PRs skip it.
name: CI frontend

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-typecheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Deterministic install from the committed lockfile (verified in-sync with package.json).
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck
